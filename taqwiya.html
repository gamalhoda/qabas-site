
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>📚 لجنة دروس التقوية</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <header><h1>📚 لجنة دروس التقوية</h1></header>
  <nav><a href="index.html">↩ العودة للرئيسية</a></nav>
  <main>
    <p class="note">🔐 يتم تعيين المسؤولة من قِبل الإدارة</p>

    <section>
      <h2>📋 المهام الحالية</h2>
      <table id="mainTaskTable">
        <thead>
          <tr>
            <th>المهمة</th>
            <th>المسؤولة</th>
            <th>تاريخ البدء</th>
            <th>تاريخ الانتهاء</th>
            <th>الحالة</th>
            <th>ملاحظات</th>
            <th>🗑️</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="form-row">
        <input type="text" id="task" placeholder="المهمة">
        <input type="text" id="person" placeholder="المسؤولة">
        <input type="date" id="start">
        <input type="date" id="end">
        <select id="status">
          <option>لم يبدأ</option>
          <option>جارية</option>
          <option>تم</option>
        </select>
        <input type="text" id="notes" placeholder="ملاحظات">
        <button onclick="addTask()">➕ أضف</button>
      </div>
    </section>

    <section>
      <h2>➕ إنشاء جدول جديد</h2>
      <button onclick="addNewTable()">➕ أضف جدول جديد</button>
      <div id="newTablesArea"></div>
    </section>
  </main>
  <footer>&copy; 2025 كتلة قبس</footer>
</body>
</html>
